<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문·벽지 수정 확인</title><style>*{box-sizing:border-box}body{margin:0;background:#191d1a;color:#eee6d8;font:16px/1.7 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px 24px}p,figcaption{color:#c9c3b7}img{width:100%;display:block}figure{margin:0 0 26px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.note{padding:16px 20px;background:#293b30;border-left:3px solid #c9b687}a{color:#d2c395}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style><main><small>HAEDAM / SURFACE REPAIR 07</small><h1>문의 찢어진 면을 복구하고, 벽지를 다시 연결했습니다</h1><p class="note">기존 문 디자인과 벽지 이미지를 사용했습니다. 아래는 수정한 실행파일을 직접 촬영한 화면입니다.</p><h2>관리실·창고 정면</h2><figure><img src="../Art/Previews/Architecture-v7/office-front.png"><figcaption>왼쪽 창고 / 오른쪽 관리실. 실제 문 모델의 면 연결을 복구했습니다.</figcaption></figure><h2>문 앞·뒤·열린 상태</h2><div class="pair"><figure><img src="../Art/Previews/Architecture-v7/door-front.png"><figcaption>관리실 문 앞면</figcaption></figure><figure><img src="../Art/Previews/Architecture-v7/door-back.png"><figcaption>관리실 문 뒷면</figcaption></figure><figure><img src="../Art/Previews/Architecture-v7/door-open.png"><figcaption>문을 연 뒤의 관리실 출입구</figcaption></figure><figure><img src="../Art/Previews/Architecture-v7/wallpaper-detail.png"><figcaption>벽지 근접: 기존 벽지 이미지의 결을 실제 벽에 적용</figcaption></figure></div><h2>관리실 내부</h2><figure><img src="../Art/Previews/Architecture-v7/office-corrected-inside.png"><figcaption>주방과 맞닿은 벽도 관리실 안쪽에서는 벽지로 마감했습니다.</figcaption></figure><h2>층별 마감</h2><div class="pair"><figure><img src="../Art/Previews/Architecture-v7/hall-1.png"><figcaption>1층 · 낡은 베이지색 벽지. 2층도 같은 마감.</figcaption></figure><figure><img src="../Art/Previews/Architecture-v7/hall-3.png"><figcaption>3층 · 리모델링한 밝고 깨끗한 벽지</figcaption></figure></div><p><a href="door-wallpaper-v7.md">원인과 검증 기록</a></p></main></html>
