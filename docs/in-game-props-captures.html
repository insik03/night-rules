<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>야간수칙 · 게임 내 소품 촬영</title>
<style>body{margin:0;background:#151917;color:#e5e8df;font:16px/1.7 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:36px 24px}h1{margin-bottom:8px}p,figcaption{color:#b8c4bc}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;background:#232a26;padding:14px;border-radius:10px}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}figcaption{margin-top:10px}strong{color:#e5e8df}a{color:inherit}@media(max-width:900px){section{grid-template-columns:1fr}}</style>
<main><h1>게임 내 소품 적용 화면</h1><p>2026-10-12 · 현재 Windows 게임 빌드에서 1600×900으로 직접 촬영한 원본 화면. 이미지를 클릭하면 크게 볼 수 있습니다.</p><p>촬영 중 확인된 문제: 방문 표면의 삼각형 형태 깨짐, 일부 소품의 과한 광택, 객실 가구가 시야를 가리는 배치. 아직 수정 전 상태입니다.</p><section id="shots"></section></main>
<script>
const shots=[['13-cctv-desk','관리실 CCTV 2단 배치','아래 3대 · 위 2대 · 총 5대'],['14-cctv-channels','CCTV 채널 전환 화면','각 모니터에서 좌우 버튼으로 채널 전환 · 녹화 되감기'],['15-cctv-upper','3층과 옥상 계단','실제 3층 복도·주방 및 옥상 계단을 촬영하는 채널'],['12-adjacent-wardrobes','옷장 2개 나란히 배치','객실 한쪽 벽에 같은 방향으로 두 개를 붙임 · 각각 독립적으로 열림'],['11-wide-table','수정된 원형 식탁','지름 2m · 높이 75cm 유지 · 의자 간격 조정'],['01-office','이전 관리실','CCTV를 5대로 늘리기 전 화면'],['02-drawer','책상 서랍','열린 서랍과 UV 카트리지'],['03-kitchen','이전 주방 배치','식탁 확대 전 비교 화면'],['07-round-table','이전 원형 식탁','지름 1.5m였던 수정 전 화면'],['08-fridge','냉장고','주방에 적용한 냉장고'],['04-room202-clear','202호','매트리스 없는 침대 프레임'],['05-wardrobe','이전 객실 옷장','옷장 한 개만 있던 배치'],['06-door','202호 방문','현재 표면 깨짐이 보이는 상태']];
for(const [file,title,note] of shots){const f=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),c=document.createElement('figcaption');a.href='../Art/Previews/CoreProps/'+file+'.png';a.target='_blank';img.src=a.href;img.alt=title;img.loading='lazy';a.append(img);c.textContent=title+' — '+note;f.append(a,c);document.querySelector('#shots').append(f);}
</script></html>
