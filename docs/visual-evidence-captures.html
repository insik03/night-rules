<body><main><small>해담고시원 / DAY 1 / 실제 게임 캡처</small><h1>설명 대신 표면을 살펴보기</h1>
<p>금속판 손상은 일반광으로, 손자국과 정비 표식은 UV로 확인합니다. E를 누르기 전부터 빛에 따라 보입니다. 조사 결과가 무엇을 뜻하는지는 자막으로 판정하지 않습니다. 맵 조명과 손전등 광량은 직전 설정에서 각각 30% 낮췄습니다.</p>
<nav><a href="visual-evidence.md">변경 내용</a> · <a href="in-game-props-captures.html">이전 소품 캡처</a></nav>
<figure><h2>01 · 문틀 금속판 — 일반광</h2><a href="../Art/Previews/VisualClues/door-normal.png"><img src="../Art/Previews/VisualClues/door-normal.png" alt="일반 손전등 아래 보이는 202호 문틀의 금속판과 긁힘"></a><figcaption>나사 둘레 긁힘과 벌어진 금속판 가장자리. 현재는 기본 메시로 만든 손상 표현입니다.</figcaption></figure>
<figure><h2>02 · 문 옆 표식 — UV</h2><a href="../Art/Previews/VisualClues/door-uv.png"><img src="../Art/Previews/VisualClues/door-uv.png" alt="UV에 드러난 세 줄 표식. 설명이나 화살표는 없음"></a><figcaption>기존의 ‘안에서 잠김 / 손잡이 없음’ 문장을 제거했습니다.</figcaption></figure>
<figure><h2>03 · 봉인 점검구 — 일반광</h2><a href="../Art/Previews/VisualClues/hatch-normal.png"><img src="../Art/Previews/VisualClues/hatch-normal.png" alt="일반 손전등으로 보는 점검구. 손자국은 보이지 않음"></a><figcaption>일반광에서는 손자국이 보이지 않고, 조사 기록도 먼저 알려주지 않습니다.</figcaption></figure>
<figure><h2>04 · 같은 점검구 — UV</h2><a href="../Art/Previews/VisualClues/hatch-uv.png"><img src="../Art/Previews/VisualClues/hatch-uv.png" alt="같은 위치를 UV로 비추자 드러난 손 모양 흔적"></a><figcaption>가까이 UV를 조준할 때만 나타납니다. 빛을 끄거나 다른 곳을 보면 숨겨집니다.</figcaption></figure>
<figure><h2>05 · 관리실 금속 조각 — UV</h2><a href="../Art/Previews/VisualClues/fragment-uv.png"><img src="../Art/Previews/VisualClues/fragment-uv.png" alt="관리실 책상의 금속 조각 표면에 드러난 UV 표식"></a><figcaption>두 장소의 흔적을 플레이어가 직접 대조합니다. 조각의 형상은 아직 임시 모델입니다.</figcaption></figure>
<p><small>캡처용 위치에서 촬영했습니다. 첫 전화 등의 HUD 상태는 해당 촬영 상태이며, 신규 맵 전체나 최종 아트 완성을 뜻하지 않습니다.</small></p></main></body></html>
