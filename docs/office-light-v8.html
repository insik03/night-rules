<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리실 조명 수정</title><style>*{box-sizing:border-box}body{margin:0;background:#191d1a;color:#eee6d8;font:16px/1.7 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px 24px}p,figcaption{color:#c9c3b7}img{width:100%;display:block}figure{margin:0 0 26px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.note{padding:16px 20px;background:#293b30;border-left:3px solid #c9b687}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style><main><small>HAEDAM / OFFICE LIGHT 08</small><h1>형광등의 실제 광원을 관리실 안으로 맞췄습니다</h1><p class="note">천장 등기구는 옮겨졌지만 실제 광원은 이전 위치에 남는 문제가 있었습니다. 광원을 새 관리실 위치에 직접 배치하고 밝기를 조정했습니다. 아래는 실행파일에서 직접 촬영한 화면입니다.</p><h2>같은 위치에서 전후 비교</h2><div class="pair"><figure><img src="../Art/Previews/Architecture-v7/office-corrected-inside.png"><figcaption>이전: 등기구는 빛나지만 책상과 전화가 어두움</figcaption></figure><figure><img src="../Art/Previews/Architecture-v8/office-corrected-inside.png"><figcaption>수정 후: 실제 광원과 등기구 위치 일치</figcaption></figure></div><h2>손전등 빛 없이 확인</h2><figure><img src="../Art/Previews/Architecture-v8/office-ceiling-only.png"><figcaption>손전등의 스포트라이트 표시를 끈 상태. 노출을 올리지 않고 관리실 조명으로 확인했습니다.</figcaption></figure><h2>규칙표와 현관에서 본 관리실</h2><div class="pair"><figure><img src="../Art/Previews/Architecture-v8/office-rules.png"><figcaption>관리실 뒤쪽 규칙표</figcaption></figure><figure><img src="../Art/Previews/Architecture-v8/office-front.png"><figcaption>현관에서 바라본 관리실</figcaption></figure></div></main></html>
